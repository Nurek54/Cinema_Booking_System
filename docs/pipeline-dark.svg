</defs><g clip-path="url(#clip)"><rect width="1280" height="520" fill="url(#bg)"/><rect width="1280" height="520" fill="url(#g1)"/><rect width="1280" height="520" fill="url(#g2)"/><rect width="1280" height="520" fill="url(#g3)"/><text x="40" y="46" font-size="13" font-weight="700" letter-spacing="2" fill="#9898a8">WHAT HAPPENS WHEN YOU CLICK „ZAREZERWUJ”</text><g style="opacity:0;animation:fadeup .6s .2s cubic-bezier(.2,.8,.2,1) forwards"><rect x="40" y="72" width="300" height="196" rx="16" fill="#12121a" stroke="#262634" filter="url(#sh)"/><rect x="40" y="90" width="4" height="56" rx="2" fill="#f59e0b"/><text x="64" y="106" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#9898a8">REQUEST</text><text class="mono" x="64" y="136" font-size="15" font-weight="700" fill="#f0f0f5"><tspan fill="#fbbf24">POST</tspan> /api/reservations/19</text><text class="mono" x="64" y="162" font-size="12.5" fill="#9898a8">Content-Type: application/json</text><rect x="64" y="180" width="252" height="64" rx="10" fill="#1d1d29"/><text class="mono" x="82" y="208" font-size="12" fill="#9898a8">body</text><text class="mono" x="82" y="232" font-size="20" font-weight="700" fill="#fbbf24">[47, 48]</text></g><g style="opacity:0;animation:pop .4s .5s forwards"><text x="64" y="300" font-size="13" fill="#9898a8">Seats picked on the map in the UI.</text><text x="64" y="322" font-size="13" fill="#9898a8">Nothing is trusted: every rule is</text><text x="64" y="344" font-size="13" fill="#9898a8">checked again on the server.</text></g><path d="M340 170 H362 V110 H392" pathLength="1" fill="none" stroke="#f59e0b" stroke-width="2" style="stroke-dasharray:1;stroke-dashoffset:1;animation:draw .5s .6s forwards"/><g style="opacity:0;animation:fadeup .5s 0.90s cubic-bezier(.2,.8,.2,1) forwards"><rect x="392" y="72" width="460" height="78" rx="14" fill="#12121a" stroke="#262634" filter="url(#sh)"/><text x="420" y="94" font-size="11" font-weight="700" letter-spacing="1.2" fill="#5a5a6e">CHECK 1</text><text x="420" y="117" font-size="16" font-weight="700" fill="#f0f0f5">Screening exists</text><text class="mono" x="420" y="138" font-size="11.5" fill="#f87171" opacity=".9">else 400 · Seans o ID=19 nie istnieje.</text></g><g style="opacity:0;animation:pop .3s 1.25s forwards"><circle cx="818" cy="111" r="15" fill="rgba(52,211,153,0.12)"/><path d="M811 111 l5 5 l9 -10" fill="none" stroke="#34d399" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><line x1="622" y1="150" x2="622" y2="164" stroke="#f59e0b" stroke-width="2" style="opacity:0;animation:pop .2s 1.30s forwards"/><g style="opacity:0;animation:fadeup .5s 1.45s cubic-bezier(.2,.8,.2,1) forwards"><rect x="392" y="164" width="460" height="78" rx="14" fill="#12121a" stroke="#262634" filter="url(#sh)"/><text x="420" y="186" font-size="11" font-weight="700" letter-spacing="1.2" fill="#5a5a6e">CHECK 2</text><text x="420" y="209" font-size="16" font-weight="700" fill="#f0f0f5">Every seat is in 1…60 (Sala 1)</text><text class="mono" x="420" y="230" font-size="11.5" fill="#f87171" opacity=".9">else 400 · Miejsce 61 nie istnieje (sala ma 60 miejsc).</text></g><g style="opacity:0;animation:pop .3s 1.80s forwards"><circle cx="818" cy="203" r="15" fill="rgba(52,211,153,0.12)"/><path d="M811 203 l5 5 l9 -10" fill="none" stroke="#34d399" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><line x1="622" y1="242" x2="622" y2="256" stroke="#f59e0b" stroke-width="2" style="opacity:0;animation:pop .2s 1.85s forwards"/><g style="opacity:0;animation:fadeup .5s 2.00s cubic-bezier(.2,.8,.2,1) forwards"><rect x="392" y="256" width="460" height="78" rx="14" fill="#12121a" stroke="#262634" filter="url(#sh)"/><text x="420" y="278" font-size="11" font-weight="700" letter-spacing="1.2" fill="#5a5a6e">CHECK 3</text><text x="420" y="301" font-size="16" font-weight="700" fill="#f0f0f5">No duplicates in the request</text><text class="mono" x="420" y="322" font-size="11.5" fill="#f87171" opacity=".9">else 400 · Lista miejsc zawiera duplikaty.</text></g><g style="opacity:0;animation:pop .3s 2.35s forwards"><circle cx="818" cy="295" r="15" fill="rgba(52,211,153,0.12)"/><path d="M811 295 l5 5 l9 -10" fill="none" stroke="#34d399" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><line x1="622" y1="334" x2="622" y2="348" stroke="#f59e0b" stroke-width="2" style="opacity:0;animation:pop .2s 2.40s forwards"/><g style="opacity:0;animation:fadeup .5s 2.55s cubic-bezier(.2,.8,.2,1) forwards"><rect x="392" y="348" width="460" height="78" rx="14" fill="#12121a" stroke="#262634" filter="url(#sh)"/><text x="420" y="370" font-size="11" font-weight="700" letter-spacing="1.2" fill="#5a5a6e">CHECK 4</text><text x="420" y="393" font-size="16" font-weight="700" fill="#f0f0f5">None of the seats is taken yet</text><text class="mono" x="420" y="414" font-size="11.5" fill="#f87171" opacity=".9">else 400 · Miejsca już zajęte: [25]</text></g><g style="opacity:0;animation:pop .3s 2.90s forwards"><circle cx="818" cy="387" r="15" fill="rgba(52,211,153,0.12)"/><path d="M811 387 l5 5 l9 -10" fill="none" stroke="#34d399" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M852 387 H876 V118 H900" pathLength="1" fill="none" stroke="#34d399" stroke-width="2" style="stroke-dasharray:1;stroke-dashoffset:1;animation:draw .6s 3.3s forwards"/><g style="opacity:0;animation:fadeup .6s 3.70s cubic-bezier(.2,.8,.2,1) forwards"><rect x="900" y="72" width="340" height="98" rx="16" fill="#12121a" stroke="#262634" filter="url(#sh)"/><rect x="900" y="90" width="4" height="62" rx="2" fill="#34d399"/><text x="924" y="98" font-size="11" font-weight="700" letter-spacing="1.2" fill="#5a5a6e">RESPONSE</text><text x="924" y="122" font-size="16" font-weight="700" fill="#f0f0f5"><tspan fill="#34d399" font-weight="800">200 OK</tspan>  Reservation #12</text><text class="mono" x="924" y="146" font-size="12.5" font-weight="400" fill="#9898a8">seats [47, 48] · Interstellar</text></g><g style="opacity:0;animation:fadeup .6s 4.10s cubic-bezier(.2,.8,.2,1) forwards"><rect x="900" y="184" width="340" height="106" rx="16" fill="#12121a" stroke="#262634" filter="url(#sh)"/><rect x="900" y="202" width="4" height="70" rx="2" fill="#f59e0b"/><text x="924" y="210" font-size="11" font-weight="700" letter-spacing="1.2" fill="#5a5a6e">REPOSITORY</text><text x="924" y="234" font-size="16" font-weight="700" fill="#f0f0f5">reservations.json</text><text class="mono" x="924" y="258" font-size="12" font-weight="400" fill="#9898a8">write → reservations.json.tmp</text><text class="mono" x="924" y="279" font-size="12" font-weight="400" fill="#9898a8">Files.move(tmp → file, REPLACE_EXISTING)</text></g><g style="opacity:0;animation:fadeup .6s 4.50s cubic-bezier(.2,.8,.2,1) forwards"><rect x="900" y="304" width="340" height="118" rx="16" fill="#12121a" stroke="#262634" filter="url(#sh)"/><rect x="900" y="322" width="4" height="82" rx="2" fill="#f59e0b"/><text x="924" y="330" font-size="11" font-weight="700" letter-spacing="1.2" fill="#5a5a6e">LOGGING SERVICE</text><text x="924" y="354" font-size="16" font-weight="700" fill="#f0f0f5">log.txt  (Admin → Logi)</text><text class="mono" x="924" y="378" font-size="11.5" font-weight="400" fill="#9898a8">[2026-10-09 21:56:24] Rezerwacja #12</text><text class="mono" x="924" y="399" font-size="11.5" font-weight="400" fill="#9898a8">na seans #19, miejsca: [47, 48]</text></g><g style="opacity:0;animation:pop .5s 5s forwards"><line x1="40" y1="464" x2="1240" y2="464" stroke="#262634"/><text class="mono" x="40" y="494" font-size="12.5" fill="#9898a8">ReservationController → ReservationService.createReservation() → ReservationRepository.save() → LoggingService.log()</text></g></g></svg>