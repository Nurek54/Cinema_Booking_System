ll="#f85149">400</tspan>  Lista miejsc zawiera duplikaty.</text><g class="l11"><text x="34" y="375" fill="#3fb950">$</text><g clip-path="url(#c11)"><text x="56" y="375" fill="#e6edf3">curl -X POST localhost:8080/api/screenings … -d '{"movie":{"id":1},"room":{"id":1},"dateTime":"2026-10-11T22:00"}'</text></g></g><text class="l12" x="34" y="400" fill="#c9d1d9"><tspan fill="#f85149">400</tspan>  Kolizja w sali "Sala 1": seans "Interstellar" trwa od 2026-10-11T21:00 do ok. 2026-10-12T00:04.</text><g class="lend"><text x="34" y="431" fill="#3fb950">$</text><rect class="cur" x="56" y="417" width="9" height="17" fill="#e6edf3"/></g></g></svg>